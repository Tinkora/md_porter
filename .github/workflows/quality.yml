name: Quality

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    uses: Tinkora/.github/.github/workflows/reusable-rust-quality.yml@54769a0c4137542fff4b3d3267ab10bef0d368a3
    with:
      working-directory: .
      toolchain: stable
      locked: true
      msrv: 1.95.0

  wasm:
    uses: Tinkora/.github/.github/workflows/reusable-wasm-quality.yml@54769a0c4137542fff4b3d3267ab10bef0d368a3
    with:
      working-directory: crates/md_porter_web
      toolchain: stable
      locked: true
      playwright-smoke: false
